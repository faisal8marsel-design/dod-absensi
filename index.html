<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>DOD Absensi</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#fff}
    #install{position:fixed;left:16px;right:16px;bottom:16px;z-index:10;display:none;
      padding:14px 16px;border:0;border-radius:14px;background:#16a34a;color:#fff;
      font:600 15px Segoe UI,Arial;box-shadow:0 8px 30px rgba(0,0,0,.22)}
    #offline{position:fixed;top:0;left:0;right:0;z-index:11;display:none;
      padding:8px;text-align:center;background:#b91c1c;color:#fff;font:600 13px Arial}
  </style>
</head>
<body>
  <div id="offline">Tidak ada koneksi internet. DOD Absensi membutuhkan koneksi untuk sinkronisasi.</div>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbzkcC6Uw-vJ6hAO34VRoUKtbRzoLrqOwu0NUMcpm1rV2ekCAnUbQTOyyY5DwYbsLvKDIw/exec"
    allow="geolocation; camera; microphone; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <button id="install">📲 Install DOD Absensi</button>
<script>
let deferredPrompt=null;
const installBtn=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; installBtn.style.display='block';
});
installBtn.addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display='none';
});
window.addEventListener('appinstalled',()=>{installBtn.style.display='none';});
function net(){
  document.getElementById('offline').style.display=navigator.onLine?'none':'block';
}
window.addEventListener('online',net); window.addEventListener('offline',net); net();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script>
</body>
</html>
