<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="application-name" content="DOD Absensi">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>DOD Absensi</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Segoe UI,Arial,sans-serif}
    #app{width:100%;height:100%;position:relative}
    iframe{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:10;transition:opacity .25s ease}
    #loading.hide{opacity:0;pointer-events:none}
    .card{text-align:center;padding:28px;max-width:420px}
    .card img{width:92px;height:92px;object-fit:contain;margin-bottom:16px}
    .title{font-size:24px;font-weight:800;color:#166534;margin-bottom:8px}
    .desc{font-size:14px;color:#6b7280;margin-bottom:18px}
    .spinner{width:38px;height:38px;border:4px solid #dcfce7;border-top-color:#16a34a;border-radius:50%;animation:spin .85s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    #error{display:none;padding:24px;text-align:center;color:#374151}
    #error.show{display:block}
    .btn{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;border:2px solid #16a34a;background:#fff;color:#166534;font-weight:800;text-decoration:none}
    @media (display-mode: standalone){body{background:#fff}}
  </style>
</head>
<body>
  <main id="app">
    <div id="loading">
      <div class="card">
        <img src="./icon-192.png" alt="DOD Absensi">
        <div class="title">DOD Absensi</div>
        <div class="desc">Memuat sistem absensi…</div>
        <div class="spinner" aria-label="Memuat"></div>
      </div>
    </div>
    <iframe
      id="dod-app"
      title="DOD Absensi"
      src="https://script.google.com/macros/s/AKfycbzkcC6Uw-vJ6hAO34VRoUKtbRzoLrqOwu0NUMcpm1rV2ekCAnUbQTOyyY5DwYbsLvKDIw/exec"
      allow="geolocation; camera; microphone"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager"></iframe>
    <div id="error">
      <h2>DOD Absensi tidak dapat dimuat</h2>
      <p>Silakan buka sistem DOD Absensi langsung melalui tombol di bawah.</p>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbzkcC6Uw-vJ6hAO34VRoUKtbRzoLrqOwu0NUMcpm1rV2ekCAnUbQTOyyY5DwYbsLvKDIw/exec">Buka DOD Absensi</a>
    </div>
  </main>
  <script>
    const frame = document.getElementById('dod-app');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    let loaded = false;

    frame.addEventListener('load', () => {
      loaded = true;
      setTimeout(() => loading.classList.add('hide'), 150);
    });

    setTimeout(() => {
      if (!loaded) {
        loading.classList.add('hide');
        error.classList.add('show');
      }
    }, 15000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', {scope:'./'})
          .catch((err) => console.warn('Service Worker tidak aktif:', err));
      });
    }
  </script>
</body>
</html>
