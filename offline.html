<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>DOD Absensi - Offline</title>
  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f7faf7;min-height:100vh;display:grid;place-items:center;color:#1f2937}
    .box{max-width:420px;margin:24px;padding:28px;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 10px;font-size:24px;color:#166534}
    p{line-height:1.55;color:#4b5563}
    button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h1>DOD Absensi</h1>
    <p>Halaman PWA tersedia, tetapi koneksi internet sedang tidak tersedia. Hubungkan internet lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
